{% extends 'base.html' %}
{% block title %}404 - Halaman Tidak Ditemukan{% endblock %}

{% block content %}
<!-- Wrapper Utama: Mengamankan seleksi teks dan memastikan posisi center sempurna -->
<div class="min-h-screen flex items-center justify-center bg-slate-50/50 px-6 select-none">
    <div class="w-full max-w-sm text-center">

        <!-- Badge Status Informasi (Sleek Error Badge) -->
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase bg-slate-100 text-slate-500 border border-slate-200/60 mb-2">
            <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span> HTTP 404
        </span>

        <!-- Angka Indikator Galat (Clean & Bold Typography) -->
        <div class="relative mb-6 flex justify-center items-center">
            <h1 class="text-8xl sm:text-9xl font-black text-slate-200/70 tracking-tighter">
                404
            </h1>
        </div>

        <!-- Detail Pesan / Deskripsi -->
        <div class="space-y-2 mb-8">
            <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">
                Halaman Tidak Ditemukan
            </h2>
            <p class="text-xs sm:text-sm text-slate-400 max-w-xs mx-auto leading-relaxed">
                Tautan mungkin telah kedaluwarsa atau terjadi kesalahan pengetikan. Mari kembali ke jalur yang benar.
            </p>
        </div>

        <!-- Tombol Tindakan (Touch Optimized & Micro-interaction) -->
        <div class="flex justify-center">
            <a href="/repository"
               class="group inline-flex items-center justify-center gap-2 w-full sm:w-auto px-6 py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold rounded-xl text-xs uppercase tracking-wider transition-all duration-200 shadow-sm shadow-indigo-500/10 cursor-pointer">
                <!-- Ikon SVG Pengganti Simbol Emoji -->
                <svg class="w-3.5 h-3.5 transition-transform group-hover:-translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span>Kembali ke Beranda</span>
            </a>
        </div>

    </div>
</div>
{% endblock %}
