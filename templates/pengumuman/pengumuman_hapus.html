{% extends 'base.html' %}
{% block title %}Hapus Pengumuman{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-5 py-9 sm:py-14 text-[var(--ink)]">
    <a href="{{ url_for('pengumuman.pengumuman_list') }}"
        class="back-link inline-flex items-center gap-2 text-sm font-semibold text-[var(--ink-soft)] hover:text-[var(--ink)] transition-colors select-none touch-manipulation">
        <i class="ph ph-arrow-left"></i> Kembali
    </a>

    <div class="mt-8 mb-10">
        <h1 class="page-title text-2xl sm:text-[26px] font-bold tracking-tight leading-snug m-0">
            Hapus Pengumuman
        </h1>
        <p class="page-sub text-md leading-relaxed text-[var(--ink-soft)] mt-2 max-w-[46ch]">
            Konfirmasi penghapusan data pengumuman berikut:
        </p>
    </div>

    <div class="bg-[#faf8f5] border border-[#e6e0d6] p-6 mb-8">
        <span class="block text-[10px] font-bold text-zinc-400 uppercase tracking-widest mb-1">Judul Pengumuman</span>
        <div class="text-[16px] font-semibold text-[#1f1c19]">{{ item.title }}</div>
    </div>

    <form id="deleteForm" action="{{ url_for('pengumuman.pengumuman_hapus', pengumuman_id=item.id) }}" method="POST"
        class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="flex items-center justify-end gap-6 pt-4">
            <a href="{{ url_for('pengumuman.pengumuman_list') }}"
                class="text-[12px] font-bold text-[#a49b8c] uppercase hover:text-[#1f1c19]">Batal</a>

            <button id="submitBtn" type="submit"
                class="w-full sm:w-auto bg-[#1f1c19] text-white text-[12px] font-bold uppercase px-6 py-3 min-h-[44px] hover:bg-[#a8501f] active:scale-[0.96] transition-all duration-150 touch-manipulation focus:outline-none focus:ring-2 focus:ring-[#a8501f]/40 cursor-pointer flex items-center justify-center gap-2">
                <span id="submitText">Ya, Hapus</span>
                <span id="submitLoader" class="hidden flex items-center gap-2">
                    <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                    </svg>
                    Menghapus...
                </span>
            </button>
        </div>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const Toast = Swal.mixin({
            toast: true,
            position: "top-end",
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            didOpen: (toast) => {
                toast.addEventListener("mouseenter", Swal.stopTimer);
                toast.addEventListener("mouseleave", Swal.resumeTimer);
            }
        });

        const form = document.getElementById("deleteForm");
        if (!form) return;

        const submitBtn = document.getElementById("submitBtn");
        const submitText = document.getElementById("submitText");
        const submitLoader = document.getElementById("submitLoader");
        const setLoading = (loading) => {
            if (submitBtn) {
                submitBtn.disabled = loading;
                submitBtn.classList.toggle(
                    "opacity-80",
                    loading
                );
                submitBtn.classList.toggle(
                    "cursor-not-allowed",
                    loading
                );
            }
            if (submitText) {
                submitText.classList.toggle(
                    "hidden",
                    loading
                );
            }
            if (submitLoader) {
                submitLoader.classList.toggle(
                    "hidden",
                    !loading
                );
            }
        };
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const confirm = await Swal.fire({
                title: "Hapus pengumuman?",
                text: "{{ item.title }}",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Hapus",
                cancelButtonText: "Batal",
                confirmButtonColor: "#a8501f"
            });
            if (!confirm.isConfirmed) return;
            setLoading(true);
            try {

                const response = await fetch(form.action, {
                    method: "POST",
                    body: new FormData(form),
                    headers: {
                        "X-Requested-With": "XMLHttpRequest"
                    }
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(
                        data.message || "Gagal menghapus"
                    );
                }
                Toast.fire({
                    icon: "success",
                    title: data.message
                });
                setTimeout(() => {
                    window.location.href =
                        data.redirect ||
                        "{{ url_for('pengumuman.pengumuman_list') }}";
                }, 1000);
            } catch (error) {
                console.error(error);
                Toast.fire({
                    icon: "error",
                    title: error.message || "Terjadi kesalahan sistem"
                });
                setLoading(false);
            }
        });
    });
</script>
{% endblock %}
