<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}e-manu{% endblock %}</title>

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

    <!-- Tailwind CSS (dihasilkan oleh Tailwind CLI) -->
    <link href="{{ url_for('static', filename='/output.css') }}" rel="stylesheet">

    <!-- Font: satu keluarga, dipakai secara sengaja (bukan Inter default) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    
    <!--Font Arab-->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Phosphor Icons (outline, satu keluarga ikon konsisten) -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">

    <!-- Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!--Quill js untuk text editor-->
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <style>
        :root {
            --ink: #17171a;
            --ink-soft: #5c5952;
            --ink-faint: #a19c92;
            --paper: #faf9f7;
            --line: #e7e4de;
            --accent: #2d5c4d;
            /* hijau tua kalem, bukan indigo generik */
            --accent-soft: #eef3f0;
            --font-arabic: 'Noto Naskh Arabic', 'Amiri', serif;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: var(--paper);
            color: var(--ink);
            overflow-x: clip;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* garis bawah nav-link, statement, bukan gradient */
        .nav-mark {
            box-shadow: inset 0 -2px 0 0 var(--accent);
        }

        .menu-panel {
            transform-origin: top right;
            transition: opacity .16s ease, transform .16s ease;
        }

        .menu-panel[data-state="closed"] {
            opacity: 0;
            transform: scale(.97) translateY(-4px);
            pointer-events: none;
        }

        .menu-panel[data-state="open"] {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* ===========================================================
           GLOBAL PAGE PRIMITIVES
           Dipakai lintas halaman (booking, jadwal, form, repository)
           supaya child template tidak perlu <style> sendiri.
           =========================================================== */

        .eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        .eyebrow.accent {
            color: var(--accent);
        }

        .page-title {
            font-weight: 800;
            letter-spacing: -0.01em;
            line-height: 1.2;
            color: var(--ink);
        }

        .page-sub {
            font-size: 14px;
            line-height: 1.6;
            color: var(--ink-soft);
        }

        /* numbered flat list — item baris */
        .idx-list {
            border-top: 1px solid var(--line);
        }

        .idx-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 2px;
            border-bottom: 1px solid var(--line);
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            transition: padding-left .15s ease-out, background-color .15s ease-out, transform .15s ease-out;
        }

        .idx-row:hover {
            padding-left: 6px;
            background: rgba(23, 23, 26, 0.025);
        }

        .idx-row:active {
            background: var(--accent-soft);
            transform: scale(0.99);
        }

        .idx-row.disabled {
            opacity: .4;
            filter: grayscale(1);
            cursor: not-allowed;
            pointer-events: none;
        }

        .idx-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--ink-faint);
            width: 22px;
            flex-shrink: 0;
            transition: color .15s ease-out;
        }

        .idx-row:hover .idx-num {
            color: var(--accent);
        }

        .idx-body {
            flex: 1;
            min-width: 0;
        }

        .idx-body h3 {
            font-size: 15px;
            font-weight: 700;
            margin: 0;
            color: var(--ink);
            transition: color .15s ease-out;
        }

        .idx-row:hover .idx-body h3 {
            color: var(--accent);
        }

        .idx-body p {
            font-size: 12.5px;
            color: var(--ink-faint);
            margin: 2px 0 0;
        }

        .idx-arrow {
            font-size: 20px;
            color: var(--ink-faint);
            flex-shrink: 0;
            transition: transform .15s ease-out, color .15s ease-out;
        }

        .idx-row:hover .idx-arrow {
            transform: translateX(3px);
            color: var(--accent);
        }

        /* back link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--ink-soft);
            text-decoration: none;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            transition: color .15s ease-out, transform .15s ease-out;
        }

        .back-link:hover {
            color: var(--ink);
            transform: translateX(-2px);
        }

        .back-link:active {
            transform: scale(.97);
        }

        /* outline button (mis. buka PDF, hari ini, dsb) */
        .btn-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 16px;
            border: 1px solid var(--line);
            color: var(--ink);
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            transition: background-color .15s ease-out, border-color .15s ease-out, transform .15s ease-out, color .15s ease-out;
        }

        .btn-outline:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-outline:active {
            background: var(--ink);
            border-color: var(--ink);
            color: #fff;
            transform: scale(.98);
        }

        /* sidebar nav (repository) */
        .sidebar-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 8px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .02em;
            text-transform: uppercase;
            color: var(--ink-soft);
            border-bottom: 1px solid var(--line);
            border-left: 2px solid transparent;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            transition: color .15s ease-out, background-color .15s ease-out, padding-left .15s ease-out, border-color .15s ease-out;
        }

        .sidebar-btn:hover {
            color: var(--ink);
            background: rgba(23, 23, 26, 0.025);
            padding-left: 14px;
            border-left-color: var(--line);
        }

        .sidebar-btn.is-active {
            color: var(--accent);
            background: var(--accent-soft);
            border-left-color: var(--accent);
            padding-left: 14px;
            font-weight: 700;
        }

        /* step row (alur administrasi) */
        .step-row {
            transition: border-color .15s ease, background-color .15s ease;
        }

        .step-row:active {
            border-left-color: var(--accent);
            background: var(--accent-soft);
        }

        .card-outline {
            border: 1px solid var(--line);
        }
    </style>
    {% block head %}{% endblock %}
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>

<body class="min-h-screen flex flex-col antialiased">

    <nav class="border-b border-[var(--line)] bg-[var(--paper)]">
        <div class="max-w-5xl mx-auto px-5 md:px-6 h-16 flex items-center justify-between">

            <a href="/" class="flex items-center gap-2.5 group select-none touch-manipulation">
                <span
                    class="font-bold tracking-tight text-[15px] text-[var(--ink)] transition-colors group-hover:text-[var(--accent)]">e-manu</span>
                <span class="text-[var(--ink-faint)] hidden sm:inline">/</span>
                <span class="mono text-[11px] uppercase tracking-widest text-[var(--ink-soft)] hidden sm:inline">Digital
                    Repository</span>
            </a>

            {% if session.get('user') %}
            <div class="relative" id="userDropdownContainer">
                <button id="dropdownBtn" type="button"
                    class="flex items-center gap-1.5 pl-2.5 pr-3 py-2 rounded-full border text-sm font-medium hover:bg-black/[.03] transition-colors focus:outline-none cursor-pointer"
                    style="border-color:var(--line);">
                    <div id="avatarIcon" class="flex items-center justify-center shrink-0">
                        <i class="ph ph-user text-sm"></i>
                    </div>
                    <span class="max-w-[90px] md:max-w-[120px] truncate">{{ session.get('user') }}</span>
                    <i id="chevronIcon"
                        class="ph ph-caret-down text-xs opacity-50 transition-transform duration-150 ml-0.5"></i>
                </button>

                <div id="dropdownMenu" data-state="closed"
                    class="menu-panel hidden absolute right-0 mt-2 w-56 rounded-xl border bg-white shadow-lg z-50 overflow-hidden"
                    style="border-color:var(--line);">

                    <div class="px-4 py-3 border-b" style="border-color:var(--line);">
                        <p class="mono text-[10px] uppercase tracking-wider opacity-50">Akun terhubung</p>
                        <p class="text-sm font-semibold truncate mt-0.5">{{ session.get('user') }}</p>
                    </div>

                    <div class="py-1">
                        <a href="{{ base_url }}" target="_blank" rel="noopener noreferrer"
                            class="flex items-center gap-3 px-4 py-2.5 text-sm hover:bg-black/[.03] transition-colors">
                            <i class="ph ph-squares-four text-base opacity-60"></i>
                            <span>e-manu</span>
                        </a>
                        <a href="{{ url_for('logout') }}"
                            class="flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
                            <i class="ph ph-sign-out text-base"></i>
                            <span>Keluar</span>
                        </a>
                    </div>
                </div>
            </div>
            {% endif %}

        </div>
    </nav>

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t mt-auto" style="border-color:var(--line); background:var(--ink);">
        <div
            class="max-w-5xl mx-auto px-6 py-5 flex flex-col sm:flex-row items-center justify-between gap-2 text-white">
            <span class="text-xs opacity-70 mono">made with 🫰</span>
            <div class="flex items-center gap-4">
                <a href="https://github.com/hanifamar17/peminjaman-barang" target="_blank"
                    class="flex items-center gap-1.5 text-xs opacity-80 hover:opacity-100 transition-opacity">
                    <i class="ph ph-github-logo text-sm"></i>
                    GitHub
                </a>
                <span class="text-xs opacity-50 mono">&copy; <span id="current-year"></span></span>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById("current-year").textContent = new Date().getFullYear();

        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('dropdownBtn');
            const menu = document.getElementById('dropdownMenu');
            const container = document.getElementById('userDropdownContainer');
            const chevron = document.getElementById('chevronIcon');

            if (!btn || !menu) return;

            const setOpen = (open) => {
                menu.classList.toggle('hidden', !open);
                menu.dataset.state = open ? 'open' : 'closed';
                chevron.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
            };

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                setOpen(menu.classList.contains('hidden'));
            });

            document.addEventListener('click', (e) => {
                if (!menu.classList.contains('hidden') && !container.contains(e.target)) setOpen(false);
            });

            menu.addEventListener('click', (e) => e.stopPropagation());
        });
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
