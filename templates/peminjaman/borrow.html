{% extends 'base.html' %}

{% block title %}Peminjaman Barang{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-5 py-9 sm:py-14 text-[#1f1c19]">
    <a href="{{ url_for('peminjaman_invlabkomp.peminjaman_landing') }}"
        class="inline-flex items-center gap-2 mb-8 text-[13px] font-medium text-[#6b6459] transition-all hover:text-[#1f1c19] hover:-translate-x-[2px]">
        <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.667 8H3.333" />
            <path d="M8 12.667 3.333 8 8 3.333" />
        </svg>
        Kembali
    </a>

    <div class="mb-10">
        <h1 class="text-[26px] leading-[1.15] font-semibold font-['Source_Serif_4',serif] tracking-[-0.01em] mb-2">
            Peminjaman Inventaris</h1>
        <p class="text-[14px] text-[#6b6459]">Pilih barang dari sistem inventaris lab.</p>
    </div>

    <div class="relative mb-8">
        <label class="block text-[11px] font-bold text-[#a49b8c] uppercase tracking-wider mb-2">Cari Barang</label>
        <div class="relative">
            <input id="searchItem" type="text"
                class="block w-full py-3 px-4 text-[14px] bg-[#f3f0ea] border-none focus:ring-2 focus:ring-[#1f1c19] transition-all"
                placeholder="Cari nama barang...">
            <div id="loader" class="hidden absolute right-4 top-3.5">
                <div class="w-4 h-4 border-2 border-[#1f1c19] border-t-transparent rounded-full animate-spin"></div>
            </div>
            <div id="searchResult"
                class="absolute left-0 right-0 mt-2 bg-white border border-[#e6e0d6] shadow-lg z-50 hidden overflow-hidden">
            </div>
        </div>
    </div>

    <form id="borrowForm" class="space-y-8 hidden">
        <input type="hidden" id="csrf_token" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <h3 class="text-[11px] font-bold text-[#a49b8c] uppercase tracking-wider mb-4">Daftar Barang</h3>
            <!-- Tabel Barang -->
            <table class="w-full text-left text-[14px] mt-4">
                <thead class="text-[11px] font-bold text-[#a49b8c] uppercase border-b border-[#e6e0d6]">
                    <tr>
                        <th class="py-2">Barang</th>
                        <th class="py-2 text-center w-20">Qty</th>
                        <th class="py-2 text-center w-10">✕</th>
                    </tr>
                </thead>
                <tbody id="selectedItems" class="divide-y divide-[#e6e0d6]"></tbody>
            </table>
        </div>

        <div class="pt-6 border-t border-[#e6e0d6] space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label class="block text-[11px] font-bold text-[#a49b8c] uppercase mb-1.5">Nama Lengkap</label>
                    <input type="text" name="borrower_name" required
                        class="w-full py-2.5 bg-transparent border-b border-[#e6e0d6] focus:border-[#1f1c19] outline-none text-[14px]">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-[#a49b8c] uppercase mb-1.5">Email</label>
                    <input type="email" name="borrower_email" required
                        class="w-full py-2.5 bg-transparent border-b border-[#e6e0d6] focus:border-[#1f1c19] outline-none text-[14px]">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-[#a49b8c] uppercase mb-1.5">Tgl Pinjam</label>
                    <input type="date" name="loan_date" required
                        class="w-full py-2.5 bg-transparent border-b border-[#e6e0d6] focus:border-[#1f1c19] outline-none text-[14px]">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-[#a49b8c] uppercase mb-1.5">Tgl Kembali</label>
                    <input type="date" name="return_date" required
                        class="w-full py-2.5 bg-transparent border-b border-[#e6e0d6] focus:border-[#1f1c19] outline-none text-[14px]">
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-[#a49b8c] uppercase mb-1.5">Catatan</label>
                <textarea name="note" rows="2"
                    class="w-full py-2.5 bg-transparent border-b border-[#e6e0d6] focus:border-[#1f1c19] outline-none text-[14px] resize-none"></textarea>
            </div>
        </div>

        <div class="border-t border-[#e6e0d6] pt-6">
            <span class="block text-[11px] font-bold text-[#a49b8c] uppercase tracking-wider mb-2">Ringkasan</span>
            <pre id="previewText"
                class="text-[12px] font-mono text-[#6b6459] bg-[#f3f0ea] p-4 whitespace-pre-wrap">Lengkapi form</pre>
        </div>

        <button type="submit" id="submitBtn"
            class="w-full bg-[#1f1c19] text-white text-[13px] font-semibold py-4 hover:bg-[#a8501f] transition-all flex items-center justify-center gap-2 cursor-pointer">
            <span id="submitText">Konfirmasi Peminjaman &rarr;</span>
            <div id="submitLoader"
                class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
        </button>
    </form>

    <div id="clickBlocker" class="fixed inset-0 bg-black/10 backdrop-blur-[1px] z-50 hidden cursor-wait transition-all">
    </div>
</div>

<script>
    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2500, timerProgressBar: true });

    document.addEventListener('DOMContentLoaded', () => {
        let selectedItems = [];
        const borrowForm = document.getElementById('borrowForm');
        const selectedItemsTable = document.getElementById('selectedItems');
        const searchInput = document.getElementById('searchItem');
        const searchResult = document.getElementById('searchResult');
        const loader = document.getElementById('loader');
        const previewText = document.getElementById('previewText');
        const clickBlocker = document.getElementById('clickBlocker');
        const originalTextHTML = submitText.innerHTML;

        let isSubmitting = false;

        const debounce = (fn, delay = 500) => { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); }; };

        const updatePreview = () => {
            const f = borrowForm;
            const itemsText = selectedItems.length ? selectedItems.map(i => `- ${i.name} × ${i.qty}`).join('\n') : '-';
            previewText.textContent = `Barang:\n${itemsText}\n\nPeminjam: ${f.borrower_name.value || '-'}\nEmail: ${f.borrower_email.value || '-'}\nTgl Pinjam: ${f.loan_date.value || '-'}\nTgl Kembali: ${f.return_date.value || '-'}`.trim();
        };

        const searchInventory = debounce(async (q) => {
            if (!q) { searchResult.classList.add('hidden'); loader.classList.add('hidden'); return; }
            loader.classList.remove('hidden');
            try {
                const res = await fetch(`{{ url_for('inventory_labkomp.api_search') }}?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                searchResult.innerHTML = '';
                searchResult.classList.remove('hidden');
                data.forEach(item => {
                    if (item.stock <= 0) return;
                    const el = document.createElement('div');
                    el.className = 'p-3 hover:bg-[#f3f0ea] cursor-pointer text-[13px]';
                    el.innerHTML = `<div class="font-semibold">${item.name}</div><div class="text-[#a49b8c]">Stok: ${item.stock}</div>`;
                    el.onclick = () => { addItem(item); searchResult.classList.add('hidden'); borrowForm.classList.remove('hidden'); searchInput.value = ''; };
                    searchResult.appendChild(el);
                });
            } catch (e) { console.error(e); }
            finally { loader.classList.add('hidden'); }
        }, 500);

        searchInput.addEventListener('input', e => searchInventory(e.target.value));

        window.addItem = (item) => {
            const exist = selectedItems.find(i => i.item_id === item.item_id);
            if (exist) { if (exist.qty < item.stock) exist.qty++; }
            else { selectedItems.push({ ...item, qty: 1 }); }
            render();
        };

        window.removeItem = (idx) => { selectedItems.splice(idx, 1); render(); };

        function render() {
            selectedItemsTable.innerHTML = '';
            selectedItems.forEach((item, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
            <td class="py-3 font-medium text-[#1f1c19]">${item.name}</td>
            <td class="py-3">
                <input type="number" value="${item.qty}" min="1" max="${item.stock}" 
                class="w-16 bg-transparent border-b border-[#e6e0d6] text-center focus:border-[#1f1c19] outline-none" 
                onchange="updateQty(${idx}, this.value)">
            </td>
            <td class="py-3 text-center">
                <button type="button" onclick="removeItem(${idx})" class="text-[#a49b8c] hover:text-red-500">✕</button>
            </td>
        `;
                selectedItemsTable.appendChild(tr);
            });
            updatePreview();
        }

        window.updateQty = (idx, val) => { selectedItems[idx].qty = parseInt(val); updatePreview(); };
        borrowForm.addEventListener('input', updatePreview);

        const setUIState = (loading) => {
            isSubmitting = loading;

            if (submitBtn) {
                submitBtn.disabled = loading;
                submitBtn.classList.toggle('opacity-75', loading);
                submitBtn.classList.toggle('cursor-not-allowed', loading);
            }

            if (submitLoader) submitLoader.classList.toggle('hidden', !loading);

            if (submitText) {
                submitText.innerHTML = loading ? 'Memproses...' : originalTextHTML;
            }

            if (clickBlocker) {
                clickBlocker.classList.toggle('hidden', !loading);
            }
        };

        borrowForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (isSubmitting) return;
            if (!selectedItems.length) return Toast.fire({ icon: 'warning', title: 'Pilih barang' });

            const confirm = await Swal.fire({
                title: 'Lanjutkan Peminjaman?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Ya, Lanjutkan'
            });

            if (!confirm.isConfirmed) return;

            setUIState(true);

            try {
                const res = await fetch('{{ url_for("peminjaman_invlabkomp.borrow_submit") }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token() }}'
                    },
                    body: JSON.stringify({
                        borrower_name: borrowForm.borrower_name.value,
                        borrower_email: borrowForm.borrower_email.value,
                        loan_date: borrowForm.loan_date.value,
                        return_date: borrowForm.return_date.value,
                        note: borrowForm.note.value,
                        items: selectedItems
                    })
                });

                const json = await res.json();

                if (json.ok) {
                    await Toast.fire({ icon: 'success', title: 'Berhasil dipinjam' });
                    location.href = '{{ url_for("peminjaman_invlabkomp.history") }}';
                    // Biarkan setUIState(true) tetap aktif saat redirect
                } else {
                    Toast.fire({ icon: 'error', title: json.error || 'Gagal' });
                    setUIState(false);
                }
            } catch (e) {
                console.error('Error:', e);
                Toast.fire({ icon: 'error', title: 'Sistem Error' });
                setUIState(false);
            }
        });
    });
</script>
{% endblock %}
