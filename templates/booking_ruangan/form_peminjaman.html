{% extends "base.html" %}
{% block title %}Form Peminjaman Lab{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-6 sm:py-10">

    <!-- Back -->
    <a href="{{ url_for('booking_ruangan.booking_landing') }}" class="inline-flex items-center gap-2 px-3 py-1.5 -ml-3 text-sm font-medium text-gray-500 rounded-lg transition-all duration-200 
          hover:text-blue-600 hover:bg-blue-50 
          active:scale-95 active:bg-gray-100 group">

        <svg class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
            </path>
        </svg>
        <span>Kembali</span>
    </a>

  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 mt-2">
    <div>
      <h1 class="text-xl sm:text-2xl font-semibold text-gray-900">Form Peminjaman Lab</h1>
      <p class="text-sm text-gray-500 mt-1">MA Nurul Ummah Kotagede</p>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <iframe
      src="{{ booking_form_embed_url }}"
      class="w-full h-[65vh] sm:h-[75vh]"
      style="border: 0;"
      loading="lazy">
      Memuat form…
    </iframe>
  </div>

  <div class="mt-4 p-3 bg-gray-50 rounded-lg border border-gray-100 flex flex-col sm:flex-row items-center justify-center gap-1 text-center text-xs text-gray-500">
    <span>Kendala saat memuat formulir?</span>
    <a href="{{ url_for('booking_ruangan.booking_form_page') }}" target="_blank" class="text-blue-600 font-medium hover:underline inline-flex items-center gap-1">
      Buka langsung di tab baru
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
      </svg>
    </a>
  </div>

</div>
{% endblock %}
