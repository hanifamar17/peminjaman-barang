{% extends "base.html" %}

{% block title %}Form Peminjaman Lab{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-5 py-9 sm:py-14 text-[var(--ink)]">

  <a href="{{ url_for('booking_ruangan.booking_landing') }}"
    class="back-link inline-flex items-center gap-2 text-sm font-semibold text-[var(--ink-soft)] hover:text-[var(--ink)] transition-colors select-none touch-manipulation">
    <i class="ph ph-arrow-left"></i> Kembali
  </a>

  <div class="mt-8 mb-10">
        <h1 class="page-title text-2xl sm:text-[26px] font-bold tracking-tight leading-snug m-0">Form Peminjaman Lab</h1>
        <p class="page-sub text-md leading-relaxed text-[var(--ink-soft)] mt-2 max-w-[46ch]">MA Nurul Ummah Kotagede</p>
    </div>

  <div class="card-outline">
    <iframe src="{{ booking_form_embed_url }}" class="w-full h-[65vh] sm:h-[75vh]" style="border: 0;" loading="lazy">
      Memuat form&hellip;
    </iframe>
  </div>

  <div class="mt-4 pt-3 flex flex-col sm:flex-row items-center justify-center gap-1 text-center text-xs page-sub"
    style="border-top:1px solid var(--line);">
    <span>Kendala saat memuat formulir?</span>
    <a href="{{ url_for('booking_ruangan.booking_form_page') }}" target="_blank" class="back-link"
      style="color:var(--accent);">
      <span>Buka langsung di tab baru</span>
      <i class="ph ph-arrow-square-out"></i>
    </a>
  </div>

</div>
{% endblock %}
